[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:api]
command=uvicorn server.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/app
autostart=true
autorestart=true
startsecs=3
environment=PORT="3000",HOSTNAME="0.0.0.0",BACKEND_ORIGIN="http://127.0.0.1:8000"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
