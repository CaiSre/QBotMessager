[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:redis]
command=redis-server /etc/redis.conf
directory=/tmp
autostart=true
autorestart=true
startsecs=2
priority=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:api]
command=uvicorn server.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=900
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
# -q 让 worker 自己配置日志级别，否则会被 saq CLI 的默认级别覆盖
command=saq -q server.worker.settings
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=900
# 收到 SIGTERM 后 worker 会等当前任务跑完，supervisord 需留出同样的时间
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=900
environment=PORT="3000",HOSTNAME="0.0.0.0",BACKEND_ORIGIN="http://127.0.0.1:8000"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
