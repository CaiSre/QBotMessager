[project]
name = "qbotmessager"
version = "0.2.0"
description = "多用户消息推送中台：钉钉/企业微信/飞书 Webhook 统一转换后推送至 QQ 机器人"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.9",
    "alembic>=1.14",
    "cryptography>=44",
    "webauthn>=3.0",
    "httpx2>=2.16.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "tzdata>=2025.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
