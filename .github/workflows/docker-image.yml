name: Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

# 默认只读；build job 单独申请 packages: write。
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUN_VERSION: "1.4.5"

jobs:
  # 质量门禁：Rust 与前端检查全绿才允许出镜像
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: qbot_test_auth
          MYSQL_USER: qbotmessager
          MYSQL_PASSWORD: testpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend

      # 每个集成测试套件使用独立数据库，避免全局表（设置、队列、引导）互相干扰。
      - name: Prepare test databases
        run: |
          mysql -h 127.0.0.1 -uroot -prootpw -e "
            CREATE DATABASE IF NOT EXISTS qbot_test_admin CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE DATABASE IF NOT EXISTS qbot_test_webhook CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE DATABASE IF NOT EXISTS qbot_test_bootstrap CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE DATABASE IF NOT EXISTS qbot_test_retention CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            GRANT ALL PRIVILEGES ON qbot_test_admin.* TO 'qbotmessager'@'%';
            GRANT ALL PRIVILEGES ON qbot_test_webhook.* TO 'qbotmessager'@'%';
            GRANT ALL PRIVILEGES ON qbot_test_bootstrap.* TO 'qbotmessager'@'%';
            GRANT ALL PRIVILEGES ON qbot_test_retention.* TO 'qbotmessager'@'%';
            FLUSH PRIVILEGES;"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: backend

      - name: Rust format
        working-directory: backend
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust test (unit)
        working-directory: backend
        run: cargo test --lib --all-features

      - name: Rust test (auth)
        working-directory: backend
        env:
          MYSQL_URL: mysql://qbotmessager:testpw@127.0.0.1:3306/qbot_test_auth
        run: cargo test --test auth_it --all-features

      - name: Rust test (admin)
        working-directory: backend
        env:
          MYSQL_URL: mysql://qbotmessager:testpw@127.0.0.1:3306/qbot_test_admin
        run: cargo test --test admin_it --all-features

      - name: Rust test (webhook)
        working-directory: backend
        env:
          MYSQL_URL: mysql://qbotmessager:testpw@127.0.0.1:3306/qbot_test_webhook
        run: cargo test --test webhook_it --all-features

      - name: Rust test (bootstrap)
        working-directory: backend
        env:
          MYSQL_URL: mysql://qbotmessager:testpw@127.0.0.1:3306/qbot_test_bootstrap
        run: cargo test --test bootstrap_it --all-features

      - name: Rust test (retention)
        working-directory: backend
        env:
          MYSQL_URL: mysql://qbotmessager:testpw@127.0.0.1:3306/qbot_test_retention
        run: cargo test --test retention_it --all-features

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Frontend install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: web
        run: bun run typecheck

      - name: Frontend build
        working-directory: web
        run: bun run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 关闭 semver 标签构建自动附加 latest，保证 latest 只跟随默认分支
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
