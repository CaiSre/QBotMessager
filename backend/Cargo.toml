[package]
name = "qbotmessager"
version = "1.0.3"
edition = "2024"

[dependencies]
actix-files = "0.7"
actix-web = "4"
apalis = { version = "1.2", features = ["tracing"] }
apalis-mysql = { version = "1.1", default-features = false, features = ["migrate", "tokio-comp"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde", "clock"] }
dashmap = "6"
dotenvy = "0.15"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "gzip",
    "charset",
    "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "mysql",
    "runtime-tokio",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webauthn-rs-core = "0.6"

[dev-dependencies]
# 仅集成测试使用：WebAuthn 断言真实签名（ES256）
p256 = { version = "0.14", features = ["ecdsa"] }
